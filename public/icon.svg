<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="fde-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="fde-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="fde-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="512" height="512" rx="104" fill="url(#fde-bg)"/>
  <rect width="510" height="510" x="1" y="1" rx="103" fill="none" stroke="url(#fde-accent)" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Network Circuit Grid -->
  <g stroke="#1e293b" stroke-width="2" stroke-dasharray="4,8" opacity="0.6">
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="384" x2="448" y2="384" />
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
  </g>

  <!-- Central Hexagonal Bastion Container -->
  <polygon points="256,120 380,192 380,336 256,408 132,336 132,192" fill="#0f172a" stroke="url(#fde-accent)" stroke-width="6"/>

  <!-- Terminal / Forward Deployment Symbol -->
  <polyline points="200,224 246,264 200,304" fill="none" stroke="#06b6d4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="266" y1="304" x2="316" y2="304" stroke="#10b981" stroke-width="12" stroke-linecap="round"/>

  <!-- Active Cluster Nodes -->
  <circle cx="256" cy="120" r="14" fill="#06b6d4" stroke="#0a0d14" stroke-width="4"/>
  <circle cx="380" cy="192" r="14" fill="#6366f1" stroke="#0a0d14" stroke-width="4"/>
  <circle cx="380" cy="336" r="14" fill="#3b82f6" stroke="#0a0d14" stroke-width="4"/>
  <circle cx="256" cy="408" r="14" fill="#10b981" stroke="#0a0d14" stroke-width="4"/>
  <circle cx="132" cy="336" r="14" fill="#06b6d4" stroke="#0a0d14" stroke-width="4"/>
  <circle cx="132" cy="192" r="14" fill="#a855f7" stroke="#0a0d14" stroke-width="4"/>
</svg>
